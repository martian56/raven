site_name: Raven Programming Language
site_description: Modern programming language built with Rust - fast, safe, and expressive
site_author: martian56
site_url: https://martian56.github.io/raven

repo_name: martian56/raven
repo_url: https://github.com/martian56/raven

theme:
  name: material
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: raven
          class: raven
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.arithmatex
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.details
  - pymdownx.superfences
  - admonition
  - pymdownx.tabbed
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search:
      lang: en

nav:
  - Home: index.md
  - Getting Started: guide/getting-started.md
  - Language Reference: guide/language-reference.md
  - Tutorials:
    - Word-frequency counter: guide/tutorials/word-frequency.md
    - Modeling data with structs and enums: guide/tutorials/task-tracker.md
    - Error handling with Option, Result, and ?: guide/tutorials/error-handling.md
    - Generics and traits: guide/tutorials/generics-and-traits.md
    - Concurrency with goroutines and channels: guide/tutorials/concurrency.md
    - A guestbook HTTP server: guide/tutorials/http-server.md
    - Calling C from Raven: guide/tutorials/c-interop.md
    - Testing your code: guide/tutorials/testing.md
    - Building and publishing a library: guide/tutorials/publishing-a-library.md
  - Standard Library:
    - Overview: guide/standard-library.md
    - Core traits: guide/stdlib/core.md
    - Text and formatting:
      - std.string: guide/stdlib/string.md
      - std.fmt: guide/stdlib/fmt.md
      - std.regex: guide/stdlib/regex.md
      - std.bytes: guide/stdlib/bytes.md
      - std.crypto: guide/stdlib/crypto.md
      - std.encoding: guide/stdlib/encoding.md
      - std.url: guide/stdlib/url.md
      - std.uuid: guide/stdlib/uuid.md
    - Data structures and iteration:
      - std.collections: guide/stdlib/collections.md
      - std.list: guide/stdlib/list.md
      - std.iter: guide/stdlib/iter.md
      - std.cmp: guide/stdlib/cmp.md
      - std.hash: guide/stdlib/hash.md
    - Numbers:
      - std.math: guide/stdlib/math.md
      - std.random: guide/stdlib/random.md
    - Input, output, and the system:
      - std.io: guide/stdlib/io.md
      - std.fs: guide/stdlib/fs.md
      - std.path: guide/stdlib/path.md
      - std.env: guide/stdlib/env.md
      - std.process: guide/stdlib/process.md
      - std.time: guide/stdlib/time.md
    - Networking:
      - std.net: guide/stdlib/net.md
      - std.http: guide/stdlib/http.md
      - std.tls: guide/stdlib/tls.md
      - std.json: guide/stdlib/json.md
    - Concurrency, errors, FFI, testing:
      - std.sync: guide/stdlib/sync.md
      - std.error: guide/stdlib/error.md
      - std.option: guide/stdlib/option.md
      - std.ffi: guide/stdlib/ffi.md
      - std.test: guide/stdlib/test.md
  - rvpm:
    - Overview and commands: guide/rvpm.md
    - Distributing applications: specs/rvpm-dist.md
  - GitHub: https://github.com/martian56/raven
  - VS Code Marketplace: https://marketplace.visualstudio.com/items?itemName=martian56.raven-language

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/martian56
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/martian58


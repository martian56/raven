name: Docker

# Publishes ghcr.io/martian56/raven after a release. It runs when the Release
# workflow finishes (a release created with GITHUB_TOKEN does not trigger
# other workflows directly), or by hand for an existing tag.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v3.3.3
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          version="${TAG#v}"
          image="ghcr.io/${{ github.repository_owner }}/raven"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A prerelease (v3.4.0-rc.1) gets only its exact tag; the X.Y alias
          # and latest move for stable releases alone.
          if [[ "$version" == *-* ]]; then
            echo "tags=$image:$version" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:$version,$image:${version%.*},$image:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the Linux release build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.v.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern "raven-*-x86_64-unknown-linux-gnu.tar.gz" --dir docker
          tar -xzf docker/raven-*-x86_64-unknown-linux-gnu.tar.gz -C docker
          mv "$(find docker -maxdepth 1 -type d -name 'raven-*')" docker/raven
          ls docker/raven

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: docker
          load: true
          tags: raven-test:latest

      - name: Smoke test
        shell: bash
        run: |
          docker run --rm raven-test:latest raven --version
          out=$(docker run --rm raven-test:latest sh -c 'printf "fun main() {\n    print(\"hello from docker\")\n}\n" > hello.rv && raven build hello.rv -o hello && ./hello')
          echo "$out"
          grep -q "hello from docker" <<< "$out"
          out=$(docker run --rm raven-test:latest sh -c 'rvpm new demo && cd demo && rvpm run')
          echo "$out"
          test -n "$out"

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: docker
          push: true
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=The Raven compiler and rvpm package manager
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
